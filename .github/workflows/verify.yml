name: Verify RootGuard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run verify:schema
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install genlayer-test==0.29.2 pytest==8.4.2 genvm-linter
      - run: python -m pytest tests/direct -v
      - run: genvm-lint contracts/RootGuard.py && genvm-lint contracts/ProtectedCounterV1.py && genvm-lint contracts/ProtectedCounterV2.py
